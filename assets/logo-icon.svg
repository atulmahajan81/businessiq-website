<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img">
  <title>BusinessIQ compass icon</title>
  <!-- outer ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#1a3c6e" stroke-width="1.2" opacity="0.18"/>
  <!-- inner ring -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#1a3c6e" stroke-width="0.8" opacity="0.1"/>
  <!-- NORTH — gold -->
  <polygon points="24,4 26.5,20 24,23 21.5,20" fill="#e8a020"/>
  <!-- SOUTH -->
  <polygon points="24,44 26.5,28 24,25 21.5,28" fill="#1a3c6e" opacity="0.3"/>
  <!-- EAST -->
  <polygon points="44,24 28,21.5 25,24 28,26.5" fill="#1a3c6e" opacity="0.4"/>
  <!-- WEST -->
  <polygon points="4,24 20,21.5 23,24 20,26.5" fill="#1a3c6e" opacity="0.4"/>
  <!-- centre jewel -->
  <circle cx="24" cy="24" r="5" fill="#fff" stroke="#1a3c6e" stroke-width="1"/>
  <circle cx="24" cy="24" r="2.8" fill="#e8a020"/>
  <circle cx="24" cy="24" r="1.2" fill="#1a3c6e"/>
</svg>
