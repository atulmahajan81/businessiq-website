<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | BusinessIQ.co.in</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 1.5rem;
      background: linear-gradient(135deg, var(--bg-light) 0%, #fff 100%);
    }
    .error-inner { max-width: 540px; }
    .error-code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .error-inner h2 { color: var(--primary); margin-bottom: 1rem; }
    .error-inner p { margin-bottom: 2rem; }
    .error-links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="container">
    <div class="nav-inner">
      <a href="/" class="nav-logo" aria-label="BusinessIQ home"><img src="/assets/logo-icon.svg" alt="" height="36" width="36" aria-hidden="true" /> Business<span>IQ</span></a>
      <a href="/#contact" class="btn btn-primary nav-cta">Get Started →</a>
    </div>
  </div>
</nav>

<div class="error-page">
  <div class="error-inner">
    <div class="error-code">404</div>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="error-links">
      <a href="/" class="btn btn-primary">← Back to Home</a>
      <a href="/brands" class="btn btn-dark">Browse Brands</a>
      <a href="/#contact" class="btn btn-outline" style="color:var(--primary);border-color:var(--primary);">Contact Us</a>
    </div>
  </div>
</div>

<footer role="contentinfo" style="background:var(--bg-dark);color:rgba(255,255,255,0.5);padding:1.5rem 0;text-align:center;">
  <p style="font-size:0.82rem;">&copy; 2026 BusinessIQ.co.in. All Rights Reserved.</p>
</footer>
<script>
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 50));
</script>
<script src="/js/analytics.js"></script>
</body>
</html>
